# 띵조 AUTO TEAM MAKER — 신규 공명자 자동 갱신
# 매일 한 번 명조 게임 데이터(Arikatsu/WutheringWaves_Data)를 확인해
# 앱에 없는 공명자가 생기면 public/chars-extra.json과 일러스트(public/assets)를 갱신하고 커밋합니다.
# 공명자 스킬 설명(public/skills)도 게임 데이터가 바뀌면 함께 갱신합니다.
# 앱 코드(src/)나 스크립트를 새로 올렸을 때도 바로 한 번 돌아 목록을 맞춥니다.
# (Actions 탭 → "신규 공명자 자동 갱신" → Run workflow 로 바로 돌릴 수도 있습니다)
# ※ 이 파일은 반드시 저장소의 .github/workflows/ 폴더 안에 있어야 GitHub가 실행합니다.
name: 신규 공명자 자동 갱신

on:
  schedule:
    - cron: '23 3 * * *'   # 매일 12:23 (한국 시간)
    - cron: '7 19 * * 0'   # 월요일 04:07 (한국 시간) — 역경의 탑 · 폐허 시즌이 바뀌는 시각 바로 뒤
  push:
    branches: [main]
    paths:
      - src/app.js
      - src/data/**
      - tools/update_chars.py
      - tools/build_assets.py
      - tools/build_skills.py
      - tools/build_wastes.py
      - tools/build_tower.py
      - tools/build_echoes.py
      - .github/workflows/update-chars.yml
  workflow_dispatch:

# 저장소 설정의 기본 권한과 상관없이 이 작업에 필요한 권한만 직접 받습니다.
permissions:
  contents: write   # public/chars-extra.json · 일러스트 커밋
  actions: write    # 60일 비활성 방지 · 커밋 뒤 사이트 배포 작업 실행

concurrency:
  group: update-chars
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 이미지 처리 도구 설치
        run: pip install --quiet pillow

      - name: 게임 데이터 받기 (필요한 파일만)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Arikatsu/WutheringWaves_Data.git gamedata
          cd gamedata
          git sparse-checkout set --no-cone \
            /BinData/role/roleinfo.json /BinData/role/roletag.json \
            /BinData/role_level/ /BinData/skill/skill.json /BinData/skill/skilllevel.json \
            /BinData/skillTree/skilltree.json /BinData/item/iteminfo.json \
            /BinData/resonate_chain/resonantchain.json /BinData/weapon/weaponconf.json \
            /BinData/property/rolepropertygrowth.json /BinData/property/baseproperty.json \
            /BinData/gacha/gachaviewinfo.json \
            /BinData/ShipTower/ /BinData/tower/ /BinData/monster_Info/monsterinfo.json \
            /BinData/phantom/phantomitem.json /BinData/phantom/phantomskill.json /BinData/VisionRecommend/ \
            /Textmaps/en/multi_text/MultiText.json \
            /Textmaps/ko/multi_text/MultiText.json
          echo "GAME_VER=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_ENV"
          echo "DATA_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='데이터: %s'

      - name: 신규 공명자 확인
        run: |
          # 스크립트는 tools/ 폴더나 저장소 맨 위 어디에 있어도 됩니다
          SCRIPT=tools/update_chars.py; [ -f "$SCRIPT" ] || SCRIPT=update_chars.py
          python "$SCRIPT" gamedata src public/chars-extra.json --version "$GAME_VER" --commit "$DATA_SHA"

      - name: 공명자 스킬 설명 만들기 (public/skills)
        continue-on-error: true
        run: python tools/build_skills.py gamedata public/skills

      - name: 죽음의 노래와 바닷속 폐허 시즌 정보 만들기 (public/wastes.json)
        continue-on-error: true
        run: python tools/build_wastes.py gamedata public/wastes.json

      - name: 역경의 탑 시즌 구성 만들기 (public/tower.json)
        continue-on-error: true
        run: python tools/build_tower.py gamedata public/tower.json

      - name: 추천 메인 에코 만들기 (public/echoes.json)
        continue-on-error: true
        run: python tools/build_echoes.py gamedata .

      - name: 캐릭터 일러스트 · 에코 아이콘 만들기 (없는 것만)
        continue-on-error: true
        run: python tools/build_assets.py gamedata . --cache "$RUNNER_TEMP/asset-cache"

      - name: 바뀐 내용이 있으면 커밋
        id: commit
        run: |
          git add -A public/assets public/skills public/wastes.json public/tower.json public/echoes.json 2>/dev/null || true
          if git diff --quiet -- public/chars-extra.json && git diff --cached --quiet -- public/assets public/skills public/wastes.json public/tower.json public/echoes.json && git ls-files --error-unmatch public/chars-extra.json >/dev/null 2>&1; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chars-extra.json
          git commit -m "신규 공명자 자동 갱신 (게임 데이터 $GAME_VER)"
          # 그사이 다른 커밋이 올라왔어도 밀리지 않게 최신 상태 위에 다시 얹어서 올립니다
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            sleep 5
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
          done
          [ "$ok" = 1 ] || { echo "::error::chars-extra.json 커밋을 올리지 못했습니다"; exit 1; }
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: 사이트 다시 배포
        if: steps.commit.outputs.pushed == '1'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" && echo "배포 요청 완료"

      - name: 예약 실행 유지 (60일 비활성 자동 중지 방지)
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-chars.yml/enable" --silent && echo "예약 실행 유지됨"
