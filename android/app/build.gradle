import groovy.json.JsonSlurper

plugins { id 'com.android.application' }

// 앱 버전은 src/data/app-version.json 하나로 관리(사이트의 앱 페이지도 같은 파일을 읽음)
def ver = new JsonSlurper().parse(rootProject.file('../src/data/app-version.json'))

android {
    namespace 'io.github.realsesame.ddingjo'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.realsesame.ddingjo'
        minSdk 24
        targetSdk 36
        versionCode ver.versionCode as int
        versionName ver.versionName as String
    }

    signingConfigs {
        release {
            // 서명은 GitHub 저장소 Secrets(ANDROID_KEYSTORE_B64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS)의 개인 키로만 합니다.
            // (예전 공개 키 keys/ddingjo-public.jks는 1.2.0부터 쓰지 않고 지웠습니다. 키가 없으면 서명 안 된 APK가 나오고 배포되지 않습니다.)
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'ddingjo'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
