<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>띵조 AUTO TEAM MAKER</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05060b; color: #f2f0e8; font: 15px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  a { color: #ffcd3c; }
  p { margin: 0; padding: 16px; text-align: center; }
</style>
</head>
<body>
<p id="msg">띵조 AUTO TEAM MAKER로 이동하는 중입니다…</p>
<script>
/* GitHub Pages는 index.html(소문자)만 첫 화면으로 찾기 때문에, 주소를 Index.html로 넘겨 줍니다.
   공유 코드(#share=…)와 주소 뒤 값은 그대로 유지합니다. */
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  var cands = [];
  if (seg.length) cands.push('/' + seg[0] + '/Index.html'); // 프로젝트 사이트: 아이디.github.io/저장소이름/
  cands.push('/Index.html');                                 // 사용자 사이트: 아이디.github.io/
  var tail = location.search + location.hash;
  (function next(i) {
    if (i >= cands.length) {
      document.getElementById('msg').innerHTML = '페이지를 찾지 못했습니다. 저장소에 <b>Index.html</b> 파일이 있는지 확인해 주세요.';
      return;
    }
    if (location.pathname === cands[i]) return next(i + 1);
    fetch(cands[i], { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { if (r.ok) location.replace(cands[i] + tail); else next(i + 1); })
      .catch(function () { next(i + 1); });
  })(0);
})();
</script>
</body>
</html>
